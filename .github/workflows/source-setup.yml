name: Source setup and CUDA
on:
  push:
    branches: [main]
    paths:
      - 'WhisperGUI/core/gpu_setup.py'
      - 'WhisperGUI/gui/gpu_dialog.py'
      - 'tools/**'
      - 'tests/test_gpu*'
      - 'Start_Windows.bat'
      - 'start_mac.command'
      - 'requirements.txt'
      - 'packaging/smoke_transcription.py'
      - '.github/workflows/source-setup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda:
    name: Windows CUDA sm_${{ matrix.cc }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cc: ['61', '121']
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Bootstrap official WinGet client on the ephemeral runner
        shell: powershell
        run: |
          Install-PackageProvider -Name NuGet -Force | Out-Null
          Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery
          Repair-WinGetPackageManager -AllUsers
          $env:LOCALAPPDATA + '\Microsoft\WindowsApps' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Clean first launch and setup launcher
        shell: cmd
        run: |
          call Start_Windows.bat --self-test build/first-launch-smoke.json
          if errorlevel 1 exit /b 1
          call tools\setup_windows.bat --self-test build/setup-launcher-smoke.json
      - name: Regression tests in the launcher-created environment
        run: venv/Scripts/python.exe -m unittest discover -s tests -v
      - name: Install CUDA and FFmpeg, compile selected architecture, test exports
        run: venv/Scripts/python.exe tools/verify_source_setup.py --backend cuda --install-tools --ci-cuda-cc ${{ matrix.cc }}
      - name: Attach evidence (no NVIDIA hardware on this runner)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-cuda-sm${{ matrix.cc }}
          path: |
            build/*.json
            build/*.log
            whisper.cpp/build/tjksub-runtime.json
            whisper.cpp/build/tjksub/**/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
