name: Source setup and CUDA
on:
  push:
    branches: [main]
    paths:
      - 'WhisperGUI/core/gpu_setup.py'
      - 'WhisperGUI/gui/gpu_dialog.py'
      - 'tools/**'
      - 'tests/test_gpu*'
      - 'Start_Windows.bat'
      - 'start_mac.command'
      - 'requirements.txt'
      - 'packaging/smoke_transcription.py'
      - '.github/workflows/source-setup.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-setup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cuda:
    name: Windows CUDA sm_${{ matrix.cc }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: '61'
            extra: '--ci-install-vs'
          - cc: '121'
            extra: ''
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Bootstrap official WinGet client on the ephemeral runner
        shell: powershell
        timeout-minutes: 10
        run: ./tools/ci_prepare_winget.ps1
      - name: Clean first launch and setup launcher
        shell: cmd
        run: |
          call Start_Windows.bat --self-test build/first-launch-smoke.json
          if errorlevel 1 exit /b 1
          call tools\setup_windows.bat --self-test build/setup-launcher-smoke.json
      - name: Regression tests in the launcher-created environment
        run: venv/Scripts/python.exe -m unittest discover -s tests -v
      - name: Install CUDA and FFmpeg, compile selected architecture, test exports
        run: venv/Scripts/python.exe tools/verify_source_setup.py --backend cuda --install-tools --ci-cuda-cc ${{ matrix.cc }} ${{ matrix.extra }}
      - name: Attach evidence (no NVIDIA hardware on this runner)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-cuda-sm${{ matrix.cc }}
          path: |
            build/*.json
            build/*.log
            whisper.cpp/build/tjksub-runtime.json
            whisper.cpp/build/tjksub/**/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn

  source-other:
    name: Source ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-vulkan
            backend: vulkan
            python: venv/Scripts/python.exe
            qt: windows
          - os: macos-15
            platform: macos-arm64
            backend: metal
            python: venv/bin/python
            qt: offscreen
          - os: macos-15-intel
            platform: macos-intel
            backend: metal
            python: venv/bin/python
            qt: offscreen
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: ${{ matrix.qt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare WinGet on ephemeral Windows runner
        if: runner.os == 'Windows'
        shell: powershell
        timeout-minutes: 10
        run: ./tools/ci_prepare_winget.ps1
      - name: Windows source launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: call tools\setup_windows.bat --self-test build/setup-launcher-smoke.json
      - name: macOS source launcher
        if: runner.os == 'macOS'
        run: bash tools/setup_mac.command --self-test build/setup-launcher-smoke.json
      - name: Source dependency installation, compilation and exports
        run: ${{ matrix.python }} tools/verify_source_setup.py --backend ${{ matrix.backend }} --install-tools --ci-compile-only
      - name: Attach source verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-${{ matrix.platform }}
          path: |
            build/*.json
            build/*.log
            whisper.cpp/build/tjksub-runtime.json
            whisper.cpp/build/tjksub/**/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
