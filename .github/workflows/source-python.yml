name: Source Python compatibility
on:
  push:
    branches: [main]
    paths:
      - 'WhisperGUI/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'Start_Windows.bat'
      - 'start_mac.command'
      - 'tools/setup_*'
      - '.github/workflows/source-python.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launch:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']
        os: [windows-2022, macos-15, macos-15-intel]
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: ${{ matrix.os == 'windows-2022' && 'windows' || 'offscreen' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Select supported Python in an empty environment
        run: python -m venv venv
      - name: Windows launcher installs dependencies and opens app
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call tools\setup_windows.bat --self-test build/python-smoke.json
          if errorlevel 1 exit /b 1
          venv\Scripts\python.exe -c "import sys; assert '.'.join(map(str, sys.version_info[:2])) == '${{ matrix.python }}'"
          if errorlevel 1 exit /b 1
          venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: macOS launcher installs dependencies and opens app
        if: runner.os == 'macOS'
        run: |
          bash tools/setup_mac.command --self-test build/python-smoke.json
          venv/bin/python -c "import sys; assert '.'.join(map(str, sys.version_info[:2])) == '${{ matrix.python }}'"
          venv/bin/python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python-${{ matrix.python }}-${{ matrix.os }}
          path: build/python-smoke.json
